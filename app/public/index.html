<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reff — offline lyrics companion for concerts. Download a pack before the show; sing along with no signal.">
  <meta name="theme-color" content="#0D0D0E">
  <title>Reff</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="preload" href="./fonts/bodoni-moda-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <div id="view"><!-- screens render here --></div>

    <!-- Search overlay (from Home) -->
    <div id="ov" class="ov" role="dialog" aria-label="Search" aria-modal="true">
      <div class="sf-row">
        <div class="sf" data-edge>
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Find a song" autocomplete="off" enterkeyhint="search" aria-label="Find a song or lyric">
          <button type="button" class="x" data-action="clear-search" aria-label="Clear search"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <button type="button" class="cancel" data-action="close-search">Cancel</button>
      </div>
      <div id="res" class="res"></div>
    </div>

    <!-- Aa display sheet -->
    <div id="sheet" class="sheet" role="dialog" aria-label="Display settings" aria-modal="false">
      <h3>Display</h3>
      <div class="srow">
        <label for="sz">Size</label>
        <input type="range" id="sz" min="24" max="46" value="30" aria-label="Lyric size in pixels">
      </div>
      <div class="srow">
        <label id="theme-label">Theme</label>
        <div class="seg" role="group" aria-labelledby="theme-label">
          <button type="button" data-action="theme-set" data-theme="dark" aria-pressed="true">Dark</button>
          <button type="button" data-action="theme-set" data-theme="light" aria-pressed="false">Light</button>
        </div>
      </div>
      <div class="srow">
        <label id="auto-label">Auto</label>
        <div class="seg" role="group" aria-labelledby="auto-label">
          <button type="button" id="au" data-action="auto-toggle" aria-pressed="false">Off</button>
        </div>
        <input type="range" id="sp" min="1" max="10" step="1" value="5" aria-label="Auto-advance speed, higher is faster">
      </div>
      <div class="srow" style="margin:0">
        <div class="seg">
          <button type="button" data-action="close-sheet" id="done">Done</button>
        </div>
      </div>
    </div>

    <!-- Jump-to-song sheet (Lyrics header) -->
    <div id="jump" class="jump" role="dialog" aria-label="Jump to song" aria-modal="true">
      <div class="jump-panel">
        <button type="button" class="grab" data-action="close-jump" aria-label="Close jump to song">
          <span class="grab-bar" aria-hidden="true"></span>
        </button>
        <div class="jump-head">
          <div class="sf" data-edge>
            <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="jq" type="search" placeholder="Jump to song" autocomplete="off" aria-label="Jump to song">
          </div>
          <button type="button" class="cancel" data-action="close-jump">Cancel</button>
        </div>
        <div id="jump-list" class="res" data-edge></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
