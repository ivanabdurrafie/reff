<!doctype html>
<html lang="en" class="ios">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Reff: offline lyrics for concerts. Download a pack before the show, sing along with no signal.">
  <meta name="theme-color" content="#06070a">
  <title>Reff: sing along offline</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="preload" href="./fonts/young-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Framework7 (MIT): the iOS chrome kit. CSS only, no F7 runtime (it would
       fight the hash router). Our styles.css loads last and owns the tokens. -->
  <link rel="stylesheet" href="./vendor/framework7-bundle.min.css">
  <link rel="stylesheet" href="./vendor/css/framework7-icons.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="offline-banner" class="banner" role="status" hidden>
    Offline. Downloaded packs still work.
  </div>

  <main id="main" tabindex="-1"></main>

  <nav class="toolbar tabbar tabbar-icons toolbar-bottom" aria-label="Primary">
    <div class="toolbar-inner">
      <a href="#/" id="tab-packs" class="tab tab-link tab-link-active" aria-current="page">
        <i class="icon f7-icons" aria-hidden="true">square_stack</i>
        <span class="tabbar-label">Packs</span>
      </a>
      <a href="#/search" id="tab-search" class="tab tab-link">
        <i class="icon f7-icons" aria-hidden="true">search</i>
        <span class="tabbar-label">Search</span>
      </a>
    </div>
  </nav>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
